# AppProject que acota el radio de acción de Argo CD para este laboratorio:
# solo puede leer este repositorio y solo puede escribir en el namespace
# intent-lab del clúster local, sin permiso para crear
# Secret/Role/RoleBinding/ServiceAccount/NetworkPolicy.
#
# clusterResourceWhitelist solo incluye Namespace, porque la Application
# usa syncOptions: CreateNamespace=true (requiere crear ese único recurso
# de clúster). Ningún otro tipo de recurso de clúster está permitido.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: intent-lab
  namespace: argocd
spec:
  description: Laboratorio intent-layer + GitOps (clúster local, uso exclusivo del namespace intent-lab)

  sourceRepos:
    - https://github.com/afloresdatec/intent-layer-lab.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: intent-lab

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceBlacklist:
    - group: ""
      kind: Secret
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: ""
      kind: ServiceAccount
    - group: networking.k8s.io
      kind: NetworkPolicy
