apiVersion: apps/v1
kind: Deployment
metadata:
  name: intent-lab
  namespace: intent-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: intent-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: intent-lab
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:latest
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
